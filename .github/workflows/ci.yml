name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: Go tests
        run: go test ./...
      - name: Go race tests for HTTP and rate limiting
        run: go test -race ./internal/service ./internal/httpapi
      - name: Go vet
        run: go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Windows end-to-end tests and native build
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-results
          path: .e2e-artifacts/
